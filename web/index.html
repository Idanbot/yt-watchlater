<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Watch later triage</title>
    <script>
      try {
        const p = JSON.parse(localStorage.getItem("yt-wl-view-v1") || "{}")
        if (p.scheme) document.documentElement.dataset.scheme = p.scheme
        if (p.scheme === "paper") {
          document.documentElement.style.colorScheme = "light"
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", "light")
        }
        if (p.fontScale) {
          document.documentElement.style.setProperty("--font-px", String(p.fontScale))
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Syne:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
