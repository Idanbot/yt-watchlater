<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#2a221c" />
    <meta
      name="description"
      content="Triage a YouTube Watch Later playlist in the browser. Export with a userscript, mark remove or keep, no upload."
    />
    <title>Watch later triage</title>
    <script>
      try {
        const p = JSON.parse(localStorage.getItem("yt-wl-view-v1") || "{}")
        if (p.scheme) document.documentElement.dataset.scheme = p.scheme
        if (p.scheme === "paper") {
          document.documentElement.style.colorScheme = "light"
          document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", "light")
        }
        if (p.fontScale) {
          document.documentElement.style.setProperty("--font-px", String(p.fontScale))
        }
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Syne:wght@700;800&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Syne:wght@700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Syne:wght@700;800&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
